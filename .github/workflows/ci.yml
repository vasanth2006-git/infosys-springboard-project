name: ShopSense CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Unit Tests
    runs-on: ubuntu-latest

    env:
      # Safe mock test configuration - all tests execute against isolated in-memory SQLite
      MYSQL_HOST: localhost
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_PORT: "3306"
      MYSQL_DB: shopsense_test_db
      GEMINI_API_KEY: "dummy_ci_test_key_for_testing"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ShopSense unit test suite
        run: |
          pytest tests -v --tb=short
